services:
  analyze_ai_content_security_audit.storage:
    class: Drupal\analyze_ai_content_security_audit\Service\SecurityVectorStorageService
    arguments: ['@database', '@config.factory', '@entity_type.manager', '@renderer', '@datetime.time']

  analyze_ai_content_security_audit.batch_service:
    class: Drupal\analyze_ai_content_security_audit\Service\SecurityAuditBatchService
    arguments: ['@entity_type.manager', '@analyze_ai_content_security_audit.storage', '@plugin.manager.analyze', '@config.factory', '@entity_type.bundle.info']

  analyze_ai_content_security_audit.vector_batch_service:
    class: Drupal\analyze_ai_content_security_audit\Service\SecurityVectorBatchService
    arguments: ['@entity_type.manager', '@analyze_ai_content_security_audit.storage', '@plugin.manager.analyze', '@database', '@config.factory', '@entity_type.bundle.info']
