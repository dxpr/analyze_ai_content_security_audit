services:
  analyze_ai_content_security_audit.storage:
    class: Drupal\analyze_ai_content_security_audit\Service\SecurityVectorStorageService
    arguments: ['@database', '@config.factory', '@entity_type.manager', '@renderer']

  Drupal\analyze_ai_content_security_audit\Hook\AnalyzeAiContentSecurityAuditHooks:
    class: Drupal\analyze_ai_content_security_audit\Hook\AnalyzeAiContentSecurityAuditHooks
    autowire: true
    arguments:
      - '@current_user'

  Drupal\analyze_ai_content_security_audit\Hook\AnalyzeAiContentSecurityAuditViewsHooks:
    class: Drupal\analyze_ai_content_security_audit\Hook\AnalyzeAiContentSecurityAuditViewsHooks
    autowire: true
